<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas — Minimal Whiteboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg id="board" width="100%" height="100%">
        <defs>
            <pattern id="grid-dots" width="30" height="30" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1" class="grid-dot" />
            </pattern>
            <pattern id="grid-lines" width="40" height="40" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="40" y2="0" class="grid-line" />
                <line x1="0" y1="0" x2="0" y2="40" class="grid-line" />
            </pattern>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
                <path d="M0,1 L7,4 L0,7z" class="arrowhead" />
            </marker>
        </defs>
        <rect id="grid-bg" width="100%" height="100%" fill="url(#grid-dots)" />
        <g id="viewport">
            <g id="edges-layer"></g>
            <g id="highlighter-layer"></g>
            <g id="drawings-layer"></g>
            <g id="nodes-layer"></g>
            <g id="laser-layer"></g>
            <g id="selection-layer"></g>
        </g>
    </svg>

    <!-- Header -->
    <div id="header" class="panel">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3L3 8l9 5 9-5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 18l9 5 9-5"/></svg>
            Canvas
        </div>
        <div id="sync-status" class="sync-badge">Local</div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar" class="panel">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="select" title="Select (V)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51z"/><path d="M13 13l6 6"/></svg><span>Select</span></button>
            <button class="tool-btn" data-tool="hand" title="Pan (H)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6M10 10.5V5.5a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M6 14a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6a5 5 0 0 0 5 5h3a6 6 0 0 0 6-6V11"/></svg><span>Pan</span></button>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
            <button class="tool-btn" data-tool="pencil" title="Pencil (P)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Pen</span></button>
            <button class="tool-btn" data-tool="marker" title="Marker (M)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/><path d="M11 8.5l4.5 4.5"/></svg><span>Marker</span></button>
            <button class="tool-btn" data-tool="laser" title="Laser (L)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1" fill="currentColor"/><path d="M12 2v4M22 12h-4M12 22v-4M2 12h4"/></svg><span>Laser</span></button>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
            <button class="tool-btn" data-tool="rect" title="Rect (R)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg><span>Rect</span></button>
            <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg><span>Circle</span></button>
            <button class="tool-btn" data-tool="triangle" title="Triangle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18L12 4z"/></svg><span>Tri</span></button>
            <button class="tool-btn" data-tool="diamond" title="Diamond"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 9-9 9-9-9z"/></svg><span>Diamond</span></button>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
            <button class="tool-btn" data-tool="line" title="Line"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg><span>Line</span></button>
            <button class="tool-btn" data-tool="arrow" title="Arrow (A)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><polyline points="12 4 20 4 20 12"/></svg><span>Arrow</span></button>
            <button class="tool-btn" data-tool="text" title="Text (T)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span>Text</span></button>
            <button class="tool-btn" data-tool="sticky" title="Sticky (S)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg><span>Sticky</span></button>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-group">
            <button class="tool-btn eraser" data-tool="eraser" title="Eraser (E)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1-1-1-3 0-4L13 2c1-1 3-1 4 0l4 4c1 1 1 3 0 4z"/><path d="M6 18l8-8"/></svg><span>Eraser</span></button>
        </div>
    </div>

    <!-- Tool Options (shows when pen/marker active) -->
    <div id="tool-options" class="panel hidden">
        <div class="tool-opt-group">
            <span class="tool-opt-label">Width</span>
            <input type="range" id="tool-stroke-width" min="1" max="40" value="4" class="prop-range tool-opt-range">
            <span id="tool-stroke-width-label" class="range-label">4px</span>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-opt-group">
            <span class="tool-opt-label">Color</span>
            <div class="color-picker">
                <input type="color" id="tool-stroke-color" value="#0f172a">
                <div id="tool-stroke-presets" class="color-presets"></div>
            </div>
        </div>
        <div class="tool-divider"></div>
        <div class="tool-opt-group">
            <span class="tool-opt-label">Style</span>
            <div class="btn-row">
                <button class="chip style-opt active" data-value="solid">Solid</button>
                <button class="chip style-opt" data-value="dashed">Dash</button>
                <button class="chip style-opt" data-value="dotted">Dot</button>
            </div>
        </div>
    </div>

    <!-- Bottom controls -->
    <div id="bottom-bar" class="panel">
        <div class="bottom-group">
            <button id="btn-page-prev" class="ctrl-btn" title="Previous Page">‹</button>
            <span id="page-indicator" class="zoom-label">1/1</span>
            <button id="btn-page-next" class="ctrl-btn" title="Next Page">›</button>
            <button id="btn-new-page" class="ctrl-btn" title="New Page">+</button>
            <span class="ctrl-divider"></span>
            <button id="btn-undo" class="ctrl-btn" title="Undo (Ctrl+Z)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            </button>
            <button id="btn-redo" class="ctrl-btn" title="Redo (Ctrl+Y)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
            </button>
            <span class="ctrl-divider"></span>
            <button id="btn-zoom-out" class="ctrl-btn" title="Zoom Out">−</button>
            <span id="zoom-text" class="zoom-label">100%</span>
            <button id="btn-zoom-in" class="ctrl-btn" title="Zoom In">+</button>
            <span class="ctrl-divider"></span>
            <button id="btn-zoom-reset" class="ctrl-btn" title="Reset Zoom">100%</button>
            <button id="btn-zoom-fit" class="ctrl-btn" title="Fit (Shift+1)">Fit</button>
        </div>
        <div class="bottom-group">
            <button id="btn-export" class="ctrl-btn" title="Export">Export</button>
            <button id="btn-settings" class="ctrl-btn" title="Settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
    </div>

    <!-- Properties panel -->
    <div id="properties" class="panel hidden">
        <div class="prop-section">
            <div class="prop-row">
                <span class="prop-label">Stroke</span>
                <div class="color-picker">
                    <input type="color" id="stroke-color-input" value="#0f172a">
                    <div id="stroke-presets" class="color-presets"></div>
                </div>
            </div>
            <div class="prop-row">
                <span class="prop-label">Fill</span>
                <div class="color-picker">
                    <input type="color" id="fill-color-input" value="#ffffff">
                    <button id="fill-none" class="chip" title="No Fill">∅</button>
                    <div id="fill-presets" class="color-presets"></div>
                </div>
            </div>
            <div class="prop-row">
                <span class="prop-label">Width</span>
                <div class="btn-row">
                    <button class="chip stroke-chip" data-value="2">2</button>
                    <button class="chip stroke-chip active" data-value="4">4</button>
                    <button class="chip stroke-chip" data-value="6">6</button>
                    <button class="chip stroke-chip" data-value="8">8</button>
                    <button class="chip stroke-chip" data-value="12">12</button>
                </div>
            </div>
            <div class="prop-row">
                <span class="prop-label">Style</span>
                <div class="btn-row">
                    <button class="chip style-chip active" data-value="solid">Solid</button>
                    <button class="chip style-chip" data-value="dashed">Dash</button>
                    <button class="chip style-chip" data-value="dotted">Dot</button>
                </div>
            </div>
            <div class="prop-row text-prop">
                <span class="prop-label">Font</span>
                <select id="font-select" class="prop-select">
                    <option value="sans">Sans</option>
                    <option value="sketch">Sketch</option>
                    <option value="mono">Mono</option>
                    <option value="serif">Serif</option>
                </select>
            </div>
            <div class="prop-row">
                <span class="prop-label">Rotate</span>
                <input type="range" id="rotation-slider" min="0" max="360" value="0" class="prop-range">
                <span id="rotation-label" class="range-label">0°</span>
            </div>
        </div>
        <div class="prop-divider"></div>
        <div class="prop-actions">
            <button id="btn-front" class="chip">Bring Front</button>
            <button id="btn-back" class="chip">Send Back</button>
            <button id="btn-duplicate" class="chip">Duplicate</button>
            <button id="btn-delete" class="chip danger">Delete</button>
        </div>
    </div>

    <!-- Export dropdown -->
    <div id="export-menu" class="panel hidden">
        <button class="menu-item" data-action="json-export">Export as JSON</button>
        <button class="menu-item" data-action="json-import">Import from JSON</button>
        <button class="menu-item" data-action="svg-export">Save as SVG</button>
        <button class="menu-item" data-action="png-export">Save as PNG</button>
        <input type="file" id="import-input" accept=".json" hidden>
    </div>

    <!-- AI Panel -->
    <div id="ai-panel" class="panel">
        <div class="ai-header">
            <span class="ai-dot"></span>
            <span class="ai-label">AI</span>
        </div>
        <button id="btn-ai-toggle" class="ai-toggle" title="AI Actions">▾</button>
        <div id="ai-actions" class="hidden">
            <button class="ai-btn" data-action="diagram">Diagram</button>
            <button class="ai-btn" data-action="mindmap">Mindmap</button>
            <button class="ai-btn" data-action="cluster">Cluster</button>
            <button class="ai-btn" data-action="explain">Explain</button>
            <button class="ai-btn" data-action="suggest">Suggest</button>
        </div>
    </div>

    <!-- AI Modal -->
    <div id="ai-modal" class="overlay hidden">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modal-title">Generate Diagram</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="ai-input" rows="4" placeholder="Describe what you want to create..."></textarea>
                <p id="ai-tip" class="tip">AI will generate elements and connect them with arrows.</p>
                <p id="ai-loading" class="tip loading hidden">Generating...</p>
            </div>
            <div class="modal-foot">
                <button id="btn-ai-cancel" class="btn secondary">Cancel</button>
                <button id="btn-ai-submit" class="btn primary">Generate</button>
            </div>
        </div>
    </div>

    <!-- Explanation Modal -->
    <div id="explain-modal" class="overlay hidden">
        <div class="modal wide">
            <div class="modal-head">
                <h3>AI Explanation</h3>
                <button class="modal-close" id="btn-close-explain">&times;</button>
            </div>
            <div class="modal-body">
                <div id="explain-text" class="markdown-content"></div>
            </div>
            <div class="modal-foot">
                <button id="btn-close-explain-ok" class="btn primary">Close</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="overlay hidden">
        <div class="modal">
            <div class="modal-head">
                <h3>Settings</h3>
                <button id="btn-close-settings" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="set-row">
                    <label>Theme</label>
                    <select id="theme-select" class="prop-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
                <div class="set-row">
                    <label>Grid</label>
                    <select id="grid-select" class="prop-select">
                        <option value="dots">Dots</option>
                        <option value="lines">Lines</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <div class="set-row">
                    <label><input type="checkbox" id="settings-snap" checked> Snap to Grid</label>
                </div>
                <div class="set-row">
                    <label><input type="checkbox" id="settings-smart" checked> Smart Shapes</label>
                </div>
                <hr class="set-divider">
                <div class="set-row">
                    <label>AI Provider</label>
                    <select id="ai-provider-select" class="prop-select">
                        <option value="builtin">Built-in (Free, no key needed)</option>
                        <option value="gemini">Gemini (Google)</option>
                        <option value="openrouter">OpenRouter</option>
                        <option value="groq">Groq</option>
                    </select>
                </div>
                <div class="set-row col" id="ai-key-row">
                    <label id="ai-key-label">API Key</label>
                    <input type="password" id="input-ai-key" placeholder="Enter your API key..." class="set-input">
                    <span class="tip" id="ai-key-hint">Get a free key at the provider's website</span>
                </div>
            </div>
            <div class="modal-foot">
                <button id="btn-settings-save" class="btn primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Suggestion toast -->
    <div id="suggestion" class="panel toast hidden">
        <div class="suggest-head">
            <strong>AI Suggestion</strong>
            <button id="btn-close-suggestion" class="modal-close">&times;</button>
        </div>
        <p id="suggestion-text"></p>
    </div>

    <!-- Error toast -->
    <div id="toast" class="toast-msg hidden"></div>

    <script src="script.js"></script>
</body>
</html>
